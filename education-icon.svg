<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <style>
      .icon-stroke { stroke: #1f2937; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #1f2937; }
    </style>
  </defs>
  
  <!-- Mortarboard (chapéu de formatura) -->
  <path d="M 50 75 L 100 35 L 150 75" class="icon-stroke"/>
  <line x1="50" y1="75" x2="150" y2="75" class="icon-stroke"/>
  
  <!-- Mortarboard front section -->
  <path d="M 60 75 L 100 50 L 140 75 L 135 90 L 65 90 Z" class="icon-stroke"/>
  
  <!-- Tassel line -->
  <line x1="145" y1="83" x2="145" y2="130" class="icon-stroke"/>
  <!-- Tassel ball -->
  <circle cx="145" cy="135" r="6" class="icon-fill"/>
  
  <!-- Top book/diploma part -->
  <path d="M 40 130 Q 40 120 50 120 L 150 120 Q 160 120 160 130 L 160 145 Q 160 155 150 155 L 50 155 Q 40 155 40 145 Z" class="icon-stroke"/>
  
  <!-- Book pages detail -->
  <line x1="60" y1="120" x2="60" y2="155" class="icon-stroke" opacity="0.6"/>
  <line x1="80" y1="120" x2="80" y2="155" class="icon-stroke" opacity="0.6"/>
  <line x1="100" y1="120" x2="100" y2="155" class="icon-stroke" opacity="0.6"/>
  <line x1="120" y1="120" x2="120" y2="155" class="icon-stroke" opacity="0.6"/>
  <line x1="140" y1="120" x2="140" y2="155" class="icon-stroke" opacity="0.6"/>
  
  <!-- Bottom books stacked -->
  <rect x="45" y="160" width="110" height="20" class="icon-stroke"/>
  <line x1="45" y1="165" x2="155" y2="165" class="icon-stroke" opacity="0.5"/>
  <line x1="45" y1="170" x2="155" y2="170" class="icon-stroke" opacity="0.5"/>
  
  <rect x="50" y="183" width="100" height="18" class="icon-stroke"/>
  <line x1="50" y1="188" x2="150" y2="188" class="icon-stroke" opacity="0.5"/>
  
  <!-- Star decoration -->
  <path d="M 100 215 L 104 225 L 114 225 L 106 231 L 110 241 L 100 235 L 90 241 L 94 231 L 86 225 L 96 225 Z" class="icon-fill"/>
</svg>
